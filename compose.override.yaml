# Solo para desarrollo: Compose lo fusiona automáticamente con compose.yaml.
# En producción se ignora nombrando solo el archivo base:
#   docker compose -f compose.yaml up -d
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      # Bind mount de lectura y escritura: los cambios en el código se recargan en caliente
      - ./api/app:/app/app
    read_only: false
