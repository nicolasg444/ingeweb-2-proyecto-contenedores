server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # CSP: el navegador solo carga scripts, fotos y peticiones de este mismo sitio. Si alguien
    # lograra inyectar un <script> de otro dominio, el navegador se negaría a ejecutarlo.
    # 'unsafe-inline' solo en estilos (React usa atributos style); nunca en scripts
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Healthcheck del contenedor web: no depende de la API
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # DNS interno de Docker. Con un nombre fijo en proxy_pass, Nginx lo resuelve una sola vez
    # al arrancar y se queda pegado a un contenedor. Con resolver + variable lo vuelve a
    # consultar cada 10 s: reparte entre todas las réplicas (--scale api=3) y sigue a la API
    # si su contenedor se recrea con otra IP, sin reiniciar web
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_destino api;

    # El navegador solo habla con Nginx; Nginx reenvía /api/ al servicio api por la red interna
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_destino:8000;
        # Tras bajar réplicas, el DNS recordado (hasta 10 s) aún incluye IPs de contenedores
        # que ya no existen. Conectar dentro de la red de Docker toma milisegundos: si en 2 s
        # no hay respuesta, Nginx prueba la siguiente réplica en vez de esperar 60 s
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Los archivos de Vite llevan hash en el nombre: se pueden cachear por mucho tiempo.
    # Se usa `expires` y no add_header para no perder los encabezados del bloque server
    location /assets/ {
        expires 1y;
    }

    # Fotos de productos y tiendas: los links están guardados en PostgreSQL (imagen_url)
    location /img/ {
        expires 7d;
    }

    # SPA: cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
