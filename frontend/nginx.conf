server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Healthcheck del contenedor web: no depende de la API
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # El navegador solo habla con Nginx; Nginx reenvía /api/ al servicio api por la red interna
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Los archivos de Vite llevan hash en el nombre: se pueden cachear por mucho tiempo.
    # Se usa `expires` y no add_header para no perder los encabezados del bloque server
    location /assets/ {
        expires 1y;
    }

    # SPA: cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
